models:
  - name: stg_items
    description: Item data with standardization applied.
    columns:
      - name: item_id
        description: The unique key for each item.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments: 
                column_type: VARCHAR
      - name: title
        description: The title of the item.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments: 
                column_type: VARCHAR
      - name: item_type
        description: The type of the item (e.g Book, DVD)
        data_tests:
          - accepted_values:
              arguments:
                values: ["DVD", "Audiobook", "Book", NULL]
      - name: category
        description: The genre/category of the item (Non-Fiction)
        data_tests:
          - accepted_values:
              arguments:
                values: ["Children", "Reference", "Film", "Fiction", "Non-Fiction", NULL]
      - name: replacement_cost
        description: The replacement cost of the item in GBP.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments: 
                column_type: DECIMAL(10,2)
      - name: home_branch_id
        description: The id of the home branch of the item.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments: 
                column_type: VARCHAR
  - name: int_items
    description: Item data with cleaning/validation applied.
    columns:
      - name: item_id
        description: The unique key for each item.
        data_tests:
          - not_null
          - unique
      - name: title
        description: The title of the item.
      - name: item_type
        description: The type of the item (e.g Book, DVD)
      - name: category
        description: The genre/category of the item (Non-Fiction)
      - name: replacement_cost
        description: The replacement cost of the item in GBP.
        data_tests:
          # TODO This passes even if its null because it checks for explicitly false WWWHHHYY?
          - dbt_utils.expression_is_true:
              arguments:
                  expression: " > 0"
      - name: home_branch_id
        description: The id of the home branch of the item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_branches')
                field: branch_id


