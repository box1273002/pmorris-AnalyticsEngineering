name: library

profile: library

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  library:
    +schema: raw

models:
  library:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    silver:
      01_standardization:
        +materialized: view
      02_validation:
        +materialized: view
vars:
  min_opened_year: 1900

